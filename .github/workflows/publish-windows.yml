name: Publish Windows application

on:
  push:
    branches: [main]
    paths:
      - local_disk_analyzer/web/**
      - scripts/package_windows.py
      - distribution/windows/**
      - .github/workflows/publish-windows.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localdisk-windows-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Package and verify the current interface
        run: python scripts/package_windows.py

      - name: Publish the Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="windows-${GITHUB_SHA:0:7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/LocalDiskAnalyzer-win-x64.zip release/SHA256SUMS.txt release/BUILD-INFO.json --clobber
          else
            gh release create "$tag" release/LocalDiskAnalyzer-win-x64.zip release/SHA256SUMS.txt release/BUILD-INFO.json \
              --target "$GITHUB_SHA" \
              --title "Localdisk for Windows — preview" \
              --prerelease \
              --notes "Portable Windows 64-bit application. Download the ZIP, choose Extract all, then open LocalDiskAnalyzer/LocalDiskAnalyzer.exe. No Git, Python, Node.js, or manual server setup is required. This build includes the current English interface and the unchanged provided Windows runtime. The executable is unsigned and has not been run on Windows in the preparation environment."
          fi
